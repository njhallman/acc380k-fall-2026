<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Opening Colab…</title>
    <style>
      body {
        margin: 3rem auto;
        max-width: 42rem;
        padding: 0 1.25rem;
        color: #333f48;
        font: 1.1rem/1.5 system-ui, sans-serif;
      }
      h1 { color: #bf5700; }
      code { overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <h1>Opening the latest notebook in Colab…</h1>
    <p id="status">One moment while we open the current course version.</p>
    <script>
      const params = new URLSearchParams(window.location.search);
      const path = params.get("path") || "";
      const allowedPath = /^(notebooks\/notebook-\d+\/(starter|12-30-section|2-00-section)|homework\/homework-\d+\/starter|cases\/case-\d+\/starter)\.ipynb$/;
      const commit = "{{ site.github.build_revision }}";

      if (!allowedPath.test(path)) {
        document.querySelector("#status").textContent = "This notebook link is not valid.";
      } else {
        const openAt = (rev) => window.location.replace(
          `https://colab.research.google.com/github/njhallman/acc380k-fall-2026/blob/${rev}/${path}`
        );
        // Ask GitHub for the newest commit of this file at click time, so a
        // notebook saved minutes ago opens even if this page is cached or the
        // Pages rebuild has not finished. Fall back to the build revision.
        const api = `https://api.github.com/repos/njhallman/acc380k-fall-2026/commits?sha=main&per_page=1&path=${encodeURIComponent(path)}`;
        const timer = new AbortController();
        setTimeout(() => timer.abort(), 4000);
        fetch(api, { cache: "no-store", signal: timer.signal })
          .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
          .then((data) => {
            const sha = data && data[0] && data[0].sha;
            openAt(/^[0-9a-f]{40}$/.test(sha || "") ? sha : commit);
          })
          .catch(() => openAt(commit));
      }
    </script>
    <noscript>JavaScript is required to request the latest notebook version.</noscript>
  </body>
</html>
