<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>html,body{margin:0}</style>
<meta charset="utf-8">
<title>Growing a Forest by Hand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a fixed 1600×900 stage scaled to fit; audit-workpaper ground, two outcome inks (orange = A, blue = not A) */
:root{
  --paper:#f4f5f0; --paper-2:#e9ebe3; --rule:#d3d7cc; --ink:#1c2633; --ink-2:#56616e;
  --a:#bf5700; --a-soft:#f2c9a6; --n:#2a5fa3; --n-soft:#bcd0ea; --q:#8a929c; --mix:#3a4654;
  --hi:#fff3c4; --chip-ink:#ffffff; --panel:#ffffff;
  --f-display:"Newsreader", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#131921; --paper-2:#1b232d; --rule:#2c3643; --ink:#e8ecef; --ink-2:#9aa6b2;
  --a:#ec8a3e; --a-soft:#6a3a17; --n:#6ea3e8; --n-soft:#20395c; --q:#7d8894; --mix:#c9d2db;
  --hi:#4a3f12; --chip-ink:#10161d; --panel:#1a222c; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#131921; --paper-2:#1b232d; --rule:#2c3643; --ink:#e8ecef; --ink-2:#9aa6b2;
  --a:#ec8a3e; --a-soft:#6a3a17; --n:#6ea3e8; --n-soft:#20395c; --q:#7d8894; --mix:#c9d2db;
  --hi:#4a3f12; --chip-ink:#10161d; --panel:#1a222c; color-scheme:dark }

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));box-sizing:border-box}
#view{position:relative;height:100%;width:100%}
#stage{position:absolute;left:50%;top:calc(50% - 26px);width:1600px;height:900px;transform-origin:50% 50%;
  background:var(--paper);
  background-image:linear-gradient(var(--rule) 1px, transparent 1px);background-size:100% 36px;background-position:0 18px;}
#stage::before{content:"";position:absolute;left:72px;top:0;bottom:0;width:1px;background:var(--a);opacity:.35}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease, visibility .45s}
.slide.on{opacity:1;visibility:visible}
.abs{position:absolute}
.h{position:absolute;left:104px;top:56px;width:1400px;margin:0;font-family:var(--f-display);font-weight:400;font-size:58px;line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
.eyebrow{position:absolute;left:104px;top:30px;font:500 15px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--a)}
.cap{position:absolute;left:104px;top:790px;width:1400px;margin:0;font-size:28px;line-height:1.35;color:var(--ink)}
.cap b{font-weight:600}
.rv{opacity:0;transition:opacity .5s ease, translate .5s ease;translate:0 10px}
.rv.shown{opacity:1;translate:0 0}
.muted{color:var(--ink-2)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ta{color:var(--a);font-weight:600}.tn{color:var(--n);font-weight:600}

/* chips = students */
.chip{position:absolute;left:0;top:0;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;
  display:grid;place-items:center;font:600 14px var(--f-body);letter-spacing:.01em;color:var(--chip-ink);
  transition:transform .85s cubic-bezier(.2,.75,.2,1), opacity .5s, background-color .4s, box-shadow .3s, filter .4s;
  box-shadow:0 1px 0 rgba(0,0,0,.12)}
.chip.ca{background:var(--a)}.chip.cn{background:var(--n)}.chip.cq{background:var(--q);color:var(--chip-ink)}
.chip.sm{width:30px;height:30px;margin:-15px 0 0 -15px;font-size:0}
.chip.dim{opacity:.22}
.chip.ring{box-shadow:0 0 0 5px var(--paper),0 0 0 9px var(--ink)}
.chip .tick{position:absolute;right:-10px;top:-12px;font:600 22px var(--f-display);color:var(--ink);opacity:0;transition:opacity .3s}
.chip.ticked .tick{opacity:1}
.mv{transition:transform .85s cubic-bezier(.2,.75,.2,1), opacity .5s, left .7s, top .7s, width .7s, height .7s}

.qbox{position:absolute;transform:translate(-50%,-50%);padding:14px 26px;border:2px solid var(--ink);border-radius:10px;background:var(--panel);
  font:500 28px var(--f-body);white-space:nowrap;transition:opacity .5s, border-color .3s, background-color .3s, left .8s, top .8s}
.bin{position:absolute;transform:translate(-50%,-50%);border:2px dashed var(--rule);border-radius:16px;transition:opacity .5s, border-color .4s, background-color .4s}
.bin.pure{border-style:solid;border-color:var(--ink)}
.lbl{position:absolute;transform:translate(-50%,-50%);font:600 22px var(--f-body);white-space:nowrap;transition:opacity .5s}
.cnt{position:absolute;transform:translate(-50%,0);font:500 22px var(--f-mono);white-space:nowrap;color:var(--ink-2);transition:opacity .4s}
svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
svg .edge{stroke:var(--ink-2);stroke-width:2.5;fill:none;transition:stroke .3s, stroke-width .3s, opacity .5s}
svg .edge.hot{stroke:var(--a);stroke-width:5}
svg text{fill:var(--ink-2);font:500 20px var(--f-body)}

/* table */
table.data{position:absolute;border-collapse:collapse;font-size:22px;font-variant-numeric:tabular-nums}
table.data th{font:600 15px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);text-align:left;padding:8px 16px;border-bottom:2px solid var(--ink)}
table.data td{padding:9px 16px;border-bottom:1px solid var(--rule);background:var(--paper)}
table.data td.c{text-align:center}
table.data tr.rey td{background:var(--hi)}
table.data.mini{font-size:18px}
table.data.mini th{font-size:12px;padding:5px 10px}
table.data.mini td{padding:5px 10px;transition:background-color .4s}
table.data.mini .dimc{color:var(--ink-2)}
table.data.mini tr.inl td{background:var(--paper-2)}
table.data.mini th.hic,table.data.mini td.hic{background:var(--hi);font-weight:600}

/* panels */
.panel{position:absolute;background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:24px 28px;box-sizing:border-box}
.panel h3{margin:0 0 12px;font:600 15px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.eq{font:400 30px var(--f-mono);line-height:1.7;font-variant-numeric:tabular-nums}
.big{font-family:var(--f-display);font-size:64px;line-height:1}

/* gini grid */
.gcell{position:absolute;border-radius:3px;transition:background-color .35s, opacity .35s, transform .35s}
.gcell.aa{background:var(--a-soft)}.gcell.nn{background:var(--n-soft)}
.gcell.mix{background:var(--mix);background-image:repeating-linear-gradient(45deg, transparent 0 5px, rgba(255,255,255,.18) 5px 8px)}
.gcell.off{opacity:0;transform:scale(.4)}
.sq{position:absolute;border:3px solid;border-radius:4px;transition:all .6s cubic-bezier(.2,.75,.2,1)}

/* bars */
.bar{position:absolute;transition:left .8s cubic-bezier(.2,.75,.2,1), width .8s cubic-bezier(.2,.75,.2,1), top .8s cubic-bezier(.2,.75,.2,1), height .8s cubic-bezier(.2,.75,.2,1), opacity .4s, background-color .4s}
.hline{position:absolute;height:0;border-top:3px dashed var(--ink-2);transition:top .8s cubic-bezier(.2,.75,.2,1), opacity .5s, width .8s}
.hline.level{border-top:4px solid var(--ink)}
.hl-l{position:absolute;font:500 20px var(--f-mono);white-space:nowrap;transition:top .8s cubic-bezier(.2,.75,.2,1), opacity .5s}

/* tree nodes */
.node{position:absolute;transform:translate(-50%,-50%);padding:12px 22px;border:2px solid var(--ink);border-radius:10px;background:var(--panel);font:500 24px var(--f-body);white-space:nowrap;transition:opacity .5s, border-color .3s, background-color .3s, box-shadow .3s}
.node.leaf{border-radius:40px;font-weight:600}
.node.leaf.la{border-color:var(--a);color:var(--a)}
.node.leaf.ln{border-color:var(--n);color:var(--n)}
.node.hot{box-shadow:0 0 0 6px var(--hi)}
.node small{display:block;font:400 17px var(--f-mono);color:var(--ink-2);margin-top:2px;text-align:center}

/* cards */
.qcard{position:absolute;transform:translate(-50%,-50%);width:320px;height:170px;border-radius:14px;border:2px solid var(--ink);background:var(--panel);
  display:grid;place-items:center;text-align:center;font:500 28px var(--f-body);transition:opacity .5s, transform .6s, background-color .4s, border-color .4s, color .4s}
.qcard.hidden{background:var(--paper-2);border-style:dashed;border-color:var(--rule);color:var(--ink-2)}
.qcard.win{border-color:var(--a);box-shadow:0 0 0 6px var(--hi)}
.qcard .sc{display:block;font:500 22px var(--f-mono);color:var(--ink-2);margin-top:6px}

/* code */
.code{position:absolute;font:400 26px/1.75 var(--f-mono);white-space:pre}
.code .ln{padding:0 18px;border-radius:6px;transition:background-color .35s, opacity .35s}
.code.focus .ln{opacity:.38}
.code .ln.on{background:var(--hi);opacity:1}
.note{position:absolute;font:500 24px var(--f-body);transition:opacity .4s, top .5s}

.nbbtn{position:absolute;display:inline-flex;align-items:center;gap:14px;padding:18px 32px;border-radius:12px;background:var(--a);color:var(--chip-ink);font:600 28px var(--f-body);text-decoration:none;box-shadow:0 2px 0 rgba(0,0,0,.15);white-space:nowrap}
.nbbtn:hover{filter:brightness(1.08)}
.nbbtn:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.nbitems{position:absolute;left:104px;top:218px;width:790px;display:grid;grid-template-columns:70px 1fr;row-gap:34px;font-size:30px;line-height:1.35}
.nbitems .k{font:500 22px var(--f-mono);color:var(--a);padding-top:7px}
.nbcode{font:400 23px/1.7 var(--f-mono);white-space:pre}

input[type=range]{accent-color:var(--a)}
.ctl{position:absolute;display:flex;align-items:center;gap:16px;font:500 22px var(--f-body)}
.ctl input{width:300px}

/* nav */
#nav{position:absolute;left:0;right:0;bottom:0;height:52px;display:flex;align-items:center;justify-content:center;gap:14px;font:500 14px var(--f-mono);color:var(--ink-2);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{font:500 14px var(--f-mono);color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:7px 14px;cursor:pointer}
#nav button:focus-visible,.ctl input:focus-visible{outline:3px solid var(--a);outline-offset:2px}
#dots{display:flex;gap:6px}
#dots i{width:7px;height:7px;border-radius:50%;background:var(--rule)}
#dots i.on{background:var(--a)}
#count{min-width:72px;text-align:center}
@media (max-width:600px){#nav .hint{display:none}}
@media (prefers-reduced-motion: reduce){*{transition-duration:0s !important;animation-duration:0s !important}}
</style>

<div id="view">
  <div id="stage" aria-live="polite"></div>
  <div id="nav">
    <button id="prev" aria-label="Previous step">←</button>
    <span id="count">1 / 1</span>
    <span id="dots"></span>
    <button id="next" aria-label="Next step">→</button>
    <span class="hint">arrow keys or click to step</span>
  </div>
</div>

<script>
(() => {
const STAGE = document.getElementById('stage');
const STU = [
  {n:'Han',   att:0,h:1,c:0,a:0},{n:'Ackbar',att:1,h:1,c:1,a:1},{n:'Luke',att:0,h:2,c:0,a:0},{n:'R2D2',att:1,h:2,c:1,a:1},
  {n:'C3P0',  att:1,h:3,c:0,a:0},{n:'Lando', att:0,h:3,c:1,a:1},{n:'Leia',att:1,h:5,c:0,a:1},{n:'Chewy',att:0,h:6,c:0,a:1}];
const BY = Object.fromEntries(STU.map(s=>[s.n,s]));
const REY = {n:'Rey',att:1,h:3,c:0,a:null};

// ---------- helpers ----------
let timers=[];
const later=(fn,ms)=>{const t=setTimeout(fn,ms);timers.push(t);return t};
const clearLater=()=>{timers.forEach(clearTimeout);timers=[]};
function mk(tag,cls,parent,html,style){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(style)e.setAttribute('style',style);if(parent)parent.appendChild(e);return e}
function put(e,x,y,s=1){e.style.transform=`translate(${x}px,${y}px) scale(${s})`}
function at(e,x,y){e.style.left=x+'px';e.style.top=y+'px';return e}
function chip(p,s,extra=''){const c=mk('div','chip '+(s.a===1?'ca':s.a===0?'cn':'cq')+' '+extra,p,(extra.includes('sm')?'':(s.a==null?s.n+'?':s.n)));mk('span','tick',c,'✓');return c}
function rowPos(n,cx,cy,cols=4,gap=80){const out=[];for(let i=0;i<n;i++){const r=Math.floor(i/cols),c=i%cols,inRow=Math.min(cols,n-r*cols);out.push([cx+(c-(inRow-1)/2)*gap,cy+r*gap])}return out}
const gini=(a,n)=>n?1-(a/n)**2-((n-a)/n)**2:0;
const f3=x=>x.toFixed(3);
const fr=(a,b)=>`${a}/${b}`;
function svgEl(p){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('width',1600);s.setAttribute('height',900);s.setAttribute('viewBox','0 0 1600 900');p.appendChild(s);return s}
function sv(tag,attrs,p){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(p)p.appendChild(e);return e}
function title(el,eyebrow,text){if(eyebrow)mk('div','eyebrow',el,eyebrow);mk('h2','h',el,text)}
function cap(el,inn,html,out,style){const c=mk('p','cap rv',el,html,style);c.dataset.in=inn;if(out!=null)c.dataset.out=out;return c}
function rv(e,inn,out){e.classList.add('rv');e.dataset.in=inn;if(out!=null)e.dataset.out=out;return e}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// tree drawing: nodes {id,x,y,html,cls}, edges [from,to,label]
function tree(el,nodes,edges,opt={}){
  const s=svgEl(el), N={}, E={};
  nodes.forEach(n=>{N[n.id]=n});
  edges.forEach(([a,b,l])=>{const A=N[a],B=N[b];
    const g=sv('g',{},s);
    const p=sv('path',{class:'edge',d:`M${A.x},${A.y+24} C${A.x},${(A.y+B.y)/2} ${B.x},${(A.y+B.y)/2} ${B.x},${B.y-24}`},g);
    const t=sv('text',{x:(A.x+B.x)/2+(B.x<A.x?-34:14),y:(A.y+B.y)/2+4,'text-anchor':B.x<A.x?'end':'start'},g);t.textContent=l;
    E[a+'-'+b]={g,p,t}});
  const D={};
  nodes.forEach(n=>{const d=mk('div','node '+(n.cls||''),el,n.html);at(d,n.x,n.y);D[n.id]=d});
  return {N:D,E,svg:s};
}

// notebooks: Colab links for the three "open the notebook" slides
const NB={
  tree:'https://colab.research.google.com/github/njhallman/acc380k-fall-2026/blob/main/notebooks/demo-first-tree/demo.ipynb',
  digits:'https://colab.research.google.com/github/njhallman/acc380k-fall-2026/blob/main/notebooks/demo-digits-forest/demo.ipynb',
  story:'https://colab.research.google.com/github/njhallman/acc380k-fall-2026/blob/main/notebooks/demo-next-word-forest/demo.ipynb'};
function notebook(el,o){
  title(el,`Notebook ${o.n} of 3`,o.title);
  mk('div','nbitems',el,o.items.map((t,i)=>`<div class="k">0${i+1}</div><div>${t}</div>`).join(''));
  const a=mk('a','nbbtn',el,'Open in Colab <span aria-hidden="true">↗</span>','left:104px;top:610px');
  a.href=o.url;a.target='_blank';a.rel='noopener';a.setAttribute('aria-label',`Open notebook ${o.n} in Colab (new tab)`);
  ['click','pointerdown'].forEach(ev=>a.addEventListener(ev,e=>e.stopPropagation()));
  mk('div','abs mono muted',el,o.time,'left:420px;top:634px;font-size:20px');
  const P=mk('div','panel',el,`<h3>${o.panel}</h3>`+(o.code?`<div class="nbcode">${o.code.join('\n')}</div>`:''),'left:960px;top:218px;width:540px');
  mk('p','cap',el,o.cap);
  return P;
}

// ---------- slide registry ----------
const slides=[];
function slide(def){const el=mk('section','slide',STAGE);el.setAttribute('aria-label',def.name||'');def.el=el;def.build(el);slides.push(def)}

// ===== 1. Title =====
slide({name:'Title',steps:1,build(el){
  mk('div','eyebrow',el,'ACC380K · Python for Accounting');
  mk('h1','abs',el,'Growing a forest<br>by hand','left:104px;top:220px;margin:0;font:400 128px/1.0 var(--f-display);letter-spacing:-.02em');
  mk('p','abs',el,'How a random forest turns eight students into a prediction, one yes/no question at a time.','left:108px;top:520px;width:640px;margin:0;font-size:30px;line-height:1.4;color:var(--ink-2)');
  mk('p','abs mono',el,'Nick Hallman','left:108px;top:700px;margin:0;font-size:20px;color:var(--ink-2)');
  // chips as a tree canopy
  const rows=[[1],[2],[2],[3]];let i=0;const order=['Leia','Ackbar','R2D2','Han','Lando','Luke','C3P0','Chewy'];
  rows.forEach((r,ri)=>{for(let k=0;k<r[0];k++){const c=chip(el,BY[order[i++]]);put(c,1180+(k-(r[0]-1)/2)*96,250+ri*92)}});
  mk('div','abs',el,'','left:1172px;top:562px;width:16px;height:120px;background:var(--ink-2);border-radius:3px');
}});

// ===== 2. Data =====
slide({name:'The data',steps:2,build(el){
  title(el,'The question','Eight students. Can they predict a ninth?');
  const t=mk('table','data',el);at(t,104,190);
  t.innerHTML='<tr><th>Student</th><th>Perfect attendance</th><th>Hours / week</th><th>Prior coding</th><th>Got an A</th></tr>'+
    STU.map(s=>`<tr><td>${s.n}</td><td class="c">${s.att?'Yes':'No'}</td><td class="c mono">${s.h}</td><td class="c">${s.c?'Yes':'No'}</td><td class="c ${s.a?'ta':'tn'}">${s.a?'Yes':'No'}</td></tr>`).join('')+
    `<tr class="rey rv" data-in="1"><td><b>Rey</b></td><td class="c">Yes</td><td class="c mono">3</td><td class="c">No</td><td class="c"><b>?</b></td></tr>`;
  rowPos(8,1250,300,4,92).forEach(([x,y],i)=>put(chip(el,STU[i]),x,y));
  const k=mk('div','abs',el,'<span class="ta">●</span> got an A &nbsp;&nbsp; <span class="tn">●</span> did not','left:1090px;top:430px;font-size:22px;color:var(--ink-2)');
  const r=chip(el,REY);put(r,1250,560);rv(r,1);
  cap(el,0,'Five got an A, three did not. Each row has three facts we could ask about.',1);
  cap(el,1,'Rey shows up: attendance yes, 3 hours a week, no prior coding. <b>What should we predict?</b>');
}});

// ===== 3. Questions sort students =====
slide({name:'Questions sort',steps:5,build(el){
  title(el,'Decision trees','A tree is a stack of yes/no questions');
  const s=svgEl(el);
  const l1=sv('path',{class:'edge',d:'M800,330 C800,420 480,400 480,470'},s),l2=sv('path',{class:'edge',d:'M800,330 C800,420 1120,400 1120,470'},s);
  [l1,l2].forEach(e=>rv(e,1));
  this.q=mk('div','qbox rv',el,'Perfect attendance?');at(this.q,800,290);this.q.dataset.in=1;
  this.bins=[[480,'Yes'],[1120,'No']].map(([x,l])=>{const b=rv(mk('div','bin',el,null,'width:380px;height:200px'),1);at(b,x,590);
    const t=rv(mk('div','lbl',el,l),1);at(t,x,460);const c=rv(mk('div','cnt',el,''),2);at(c,x,700);return {b,c}});
  this.chips=STU.map(s=>chip(el,s));
  cap(el,0,'Start with everyone in one group.',1);
  cap(el,1,'Ask one question. Everyone answers yes or no.',2);
  cap(el,2,'Attendance splits them, but <b>both groups are still mixed</b>.',3);
  cap(el,3,'Prior coding does better: the Yes group is <b>pure</b>. Every student in it got an A.',4);
  cap(el,4,'To choose between questions, we need a number for <b>how mixed</b> a group is.');
},go(st){
  const key=st>=3?'c':'att';
  this.q.textContent=st>=3?'Prior coding?':'Perfect attendance?';
  if(st<2){rowPos(8,800,st<1?470:600,8,96).forEach(([x,y],i)=>put(this.chips[i],x,y));this.bins.forEach(b=>b.b.classList.remove('pure'));return}
  const yes=STU.filter(s=>s[key]),no=STU.filter(s=>!s[key]);
  [[yes,480,0],[no,1120,1]].forEach(([g,x,bi])=>{
    rowPos(g.length,x,555,4,84).forEach(([px,py],i)=>put(this.chips[STU.indexOf(g[i])],px,py));

  this.panel=rv(mk('div','panel',el,`<h3>The catch</h3><div style="font-size:24px;line-height:1.5">This curve assumes the trees make <b>independent</b> mistakes. Trees grown from the same data make related mistakes, so real gains are smaller.<br><br>Bootstrap rows and dealt questions exist to make the mistakes less alike.</div>`,'left:1060px;top:250px;width:470px'),2);
  this.res=rv(mk('div','panel',el,`<h3>What the vote fixes</h3><div style="font-size:23px;line-height:1.5">Each tree memorizes different quirks of the students it learned from, so the vote cancels much of the <b>overfitting</b>.</div>`,'left:1060px;top:600px;width:470px'),2);
},maj(n,p){let s=0,c=1;for(let k=0;k<=n;k++){if(k>0)c=c*(n-k+1)/k;if(k>n/2)s+=c*p**k*(1-p)**(n-k)}return s},
draw(p,hideLine){this.pv.textContent=Math.round(p*100)+'%';let d='';for(let n=1;n<=51;n+=2)d+=(n>1?'L':'M')+this.X(n)+','+this.Y(this.maj(n,p));
  this.path.setAttribute('d',d);const L=this.path.getTotalLength?this.path.getTotalLength():2000;this.path.style.strokeDasharray=L;this.path.style.strokeDashoffset=hideLine?L:0;
  this.dot.setAttribute('cx',this.X(1));this.dot.setAttribute('cy',this.Y(p));
  this.ovBr.setAttribute('y2',this.Y(p));this.ovTxt.style.top=(this.Y(1)+(this.Y(p)-this.Y(1))*.28-16)+'px';
  this.lab.innerHTML=hideLine?`one tree: ${Math.round(p*100)}% right`:`one tree: ${Math.round(p*100)}% · majority of 51: ${(this.maj(51,p)*100).toFixed(1)}%`},
go(st){this.ov.forEach(e=>e.style.opacity=st>=2?1:0);this.draw(+this.inp.value/100,true);if(st>=1)requestAnimationFrame(()=>requestAnimationFrame(()=>this.draw(+this.inp.value/100,false)))}});

// ---------- engine ----------
let cur=0,st=0,last={i:-1,s:-1};
const dots=document.getElementById('dots'),count=document.getElementById('count');
function show(){
  clearLater();
  const anim=(last.i===cur&&st===last.s+1);
  slides.forEach((s,j)=>s.el.classList.toggle('on',j===cur));
  const S=slides[cur];
  S.el.querySelectorAll('[data-in]').forEach(e=>{const i=+e.dataset.in,o=e.dataset.out;e.classList.toggle('shown',st>=i&&(o===undefined||st<+o))});
  if(S.go)S.go.call(S,st,anim);
  count.textContent=`${cur+1} / ${slides.length}`;
  dots.innerHTML='';for(let k=0;k<S.steps;k++)mk('i',k<=st?'on':'',dots);
  last={i:cur,s:st};
  try{history.replaceState(null,'','#slide-'+(cur+1))}catch(e){}
}
function next(){if(st<slides[cur].steps-1)st++;else if(cur<slides.length-1){cur++;st=0}show()}
function prev(){if(st>0)st--;else if(cur>0){cur--;st=slides[cur].steps-1}show()}
document.getElementById('next').onclick=e=>{e.stopPropagation();next()};
document.getElementById('prev').onclick=e=>{e.stopPropagation();prev()};
STAGE.addEventListener('click',e=>{const r=STAGE.getBoundingClientRect();(e.clientX-r.left<r.width*0.25)?prev():next()});
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='A')return;
  if(['ArrowRight','ArrowDown',' ','PageDown','Enter'].includes(e.key)){e.preventDefault();next()}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();prev()}
  else if(e.key==='Home'){cur=0;st=0;show()}else if(e.key==='End'){cur=slides.length-1;st=0;show()}
  else if(e.key==='f'){const d=document.documentElement;(document.fullscreenElement?document.exitFullscreen():d.requestFullscreen?.())?.catch?.(()=>{})}});
function fit(){const v=document.getElementById('view');const w=v.clientWidth,h=v.clientHeight-52;const s=Math.min(w/1600,h/900);STAGE.style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();
function fromHash(){const m=/^#slide-(\d+)$/.exec(location.hash);if(m){const n=Math.min(slides.length,Math.max(1,+m[1]));if(n-1!==cur){cur=n-1;st=0;last={i:-1,s:-1};show()}}}
addEventListener('hashchange',fromHash);
const m=/^#slide-(\d+)$/.exec(location.hash);if(m)cur=Math.min(slides.length,Math.max(1,+m[1]))-1;
show();
})();
